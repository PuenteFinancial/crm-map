<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>crm-map · offline</title>
  <style>
    :root { --bg: #ffffff; --fg: #111827; --muted: #6b7280; --btn-bg: #111827; --btn-fg: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #ededed; --muted: #9ca3af; --btn-bg: #ffffff; --btn-fg: #111827; } }
    body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
           background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, sans-serif; padding: 0 16px; }
    main { max-width: 22rem; text-align: center; }
    p { color: var(--muted); line-height: 1.5; }
    button { margin-top: 8px; border: 0; border-radius: 12px; padding: 12px 20px; font: inherit; font-weight: 600;
             background: var(--btn-bg); color: var(--btn-fg); }
  </style>
</head>
<body>
  <main>
    <h1>No signal</h1>
    <p>This page hasn't been saved on this phone yet. Once you're back online, open crm-map once and it'll work offline from then on.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
